[build-system]
requires = ["flit_core >=3.4"]
build-backend = "flit_core.buildapi"
[project]
name = "sigmund"
authors = [
    {name = "Sebastiaan Mathôt", email = "s.mathot@cogsci.nl"}
]
readme = "readme.md"
license = {file = "COPYING"}
requires-python = ">=3.8"
dynamic = ["version", "description"]
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "bibtexparser==1.4.4",
    "cryptography",
    "chromadb",
    "datamatrix",
    "flask",
    "flask-login",
    "flask-sqlalchemy",
    "flask-wtf",
    "flask-cors",
    "flask-migrate",
    "flask-session",
    "jinja2",
    "jq",
    "markdown",
    "mcp>=2,<3",
    "oauthlib",
    "openai",
    "mistralai>=2.1.3",
    "pillow",
    "pyalex",
    "pygments",
    "pyopenssl",
    "python-dotenv",
    "redis",
    "requests",
    "scholarly",
    "stripe",
    "tiktoken",
    "zai-sdk"
]
keywords = ["ai", "chatbot", "llm"]
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "mcp>=2,<3"
]
# Extra for the MCP server (see sigmund/mcp_server.py). The mcp package
# requires Python 3.10 or later, and is therefore kept out of the base
# dependencies, which support older Python versions.
mcp = [
    "mcp>=2,<3"
]
[project.urls]
Documentation = "https://sigmundai.eu"
Source = "https://github.com/open-cogsci/sigmund-ai"
